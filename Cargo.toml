[package]
name = "new-finder"
version = "0.2.2"
license = "GPL-3.0-only"
repository = "https://github.com/getf2/f2"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.7.3"
fsearch = { git = "https://github.com/noahdunnagan/fsearch", rev = "88e63fdf850cf7749deae8198b187accd21f8ba5" }
chrono = "0.4"
futures = "0.3"
image = { version = "0.25", default-features = false }
gif = "0.14"
libc = "0.2"
# (GPUI's own, for its paths' round caps and joins.)
lyon_tessellation = "1"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# (Ed25519 and SHA-256: the extension store's signed list, and its files.)
ring = "0.17"
# (Typing's word lists, looked up where they're built in.)
fst = "0.4"
# (The notch's terminal: what a terminal is, and the shell under it; GPUI
# draws it.)
alacritty_terminal = "0.26"
# (Alacritty's config, its look imported into the notch's terminal.)
toml = "0.8"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
# (No debug info for dependencies: most of target/debug's size. To debug
# one, give it its own `[profile.dev.package.<name>] debug = true`.)
debug = false

# fsearch as of that rev, plus `Engine::with_live` (folder sizes from its
# index): see vendor/README.md.
[patch."https://github.com/noahdunnagan/fsearch"]
fsearch = { path = "vendor/fsearch" }

# fsearch computes `b - a` eagerly in `(a < b).then_some(...)` (query.rs),
# which underflows harmlessly in release but panics with debug checks.
[profile.dev.package.fsearch]
overflow-checks = false
